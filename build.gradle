plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.144'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21.1, so mods must target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// ModDevGradle registers only the NeoForged and Mojang repositories. JUnit
// lives on Central.
repositories {
    mavenCentral()
}

// Three layers, one direction of dependency:
//
//   domain   <--  main (adapters)  <--  gametest (a real server)
//     ^
//     +----  test (plain JUnit; no Minecraft on its classpath at all)
//
// `domain` is the pure layer: the decisions this mod makes, over plain numbers
// and booleans. It is compiled against nothing but the JDK, so a
// `net.minecraft` import there is a compile error rather than something a
// reviewer has to catch. `gametest` is the only source set besides `main`
// that receives the modding dependencies; `test` never does, which is what
// keeps it fast and honest -- a test can only exercise what is pure.
sourceSets {
    domain
    gametest
}

// In a dev run SharedConstants.IS_RUNNING_IN_IDE is true, so the structure
// template manager reads gametest templates from <cwd>/gameteststructures/
// rather than from a resource pack. The templates are kept under devtools/
// beside the mcfunction harness and copied into place before the run.
var copyGameTestStructures = tasks.register("copyGameTestStructures", Copy) {
    from "devtools/gameteststructures"
    into "run/gameteststructures"
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        // The userdev `gameTestServer` run type: boots a headless server with
        // NeoForge's gametest framework enabled, runs every @GameTest in the
        // enabled namespaces, and exits with the number of failed required
        // tests -- so a red test fails the Gradle task. ModDevGradle has no
        // helper for this type the way it has client()/server(); `type` maps
        // straight onto the run-type key in NeoForge's userdev config.json.
        gameTestServer {
            type = "gameTestServer"
            sourceSet = sourceSets.gametest
            // NeoForge 21.1 reads the `neoforge.` prefix. The Forge-era
            // `forge.enabledGameTestNamespaces` is silently ignored.
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            taskBefore copyGameTestStructures
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.domain)
            sourceSet(sourceSets.main)
            // FML must see the @GameTestHolder class as part of this mod for
            // the annotation scan to find it.
            sourceSet(sourceSets.gametest)
        }
    }

    // Deliberately not `domain` and not `test` -- see the layering comment.
    addModdingDependenciesTo(sourceSets.gametest)
}

dependencies {
    // Another Gun Mod isn't published to any Maven repo, so the jar is vendored
    // in libs/. compileOnly: we call its public API (items, data components,
    // BulletBuilder) but never bundle any of it - the pack supplies the real
    // mod at runtime, and neoforge.mods.toml makes it a hard dependency.
    compileOnly files("libs/${gunmod_jar}")

    implementation sourceSets.domain.output

    gametestImplementation sourceSets.main.output
    gametestImplementation sourceSets.domain.output

    // Plain JUnit 5 against the pure layer only. Gradle 9 no longer injects
    // the platform launcher, so it is declared. These exact versions are the
    // ones already in the local Gradle cache.
    testImplementation sourceSets.domain.output
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.9.2'
    testRuntimeOnly    'org.junit.jupiter:junit-jupiter-engine:5.9.2'
    testRuntimeOnly    'org.junit.platform:junit-platform-launcher:1.9.2'
}

tasks.named('test', Test) {
    // Gradle enables -ea for Test tasks by default; the domain layer's
    // checkRep() methods are `assert`s and rely on it.
    useJUnitPlatform()
}

// The shipped jar is main + domain. gametest is never shipped.
jar {
    from sourceSets.domain.output
}

// NeoForge dev runs scan run/mods, so the gun mod has to physically be there or
// our hard dependency fails and the run dies before it starts. runGameTestServer
// matches the filter, so it is covered too.
var copyGunModForRuns = tasks.register("copyGunModForRuns", Copy) {
    from "libs/${gunmod_jar}"
    into "run/mods"
}
tasks.matching { it.name.startsWith("run") }.configureEach {
    dependsOn copyGunModForRuns
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
