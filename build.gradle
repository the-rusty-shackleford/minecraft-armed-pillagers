plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.144'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// The Another Gun Mod bridge is an optional subproject (see settings.gradle).
// When it is present the dev runs host it as a second mod, which needs its
// source set configured before this file reads it.
def bridgeAgm = findProject(':bridges:agm')
if (bridgeAgm != null) {
    evaluationDependsOn(':bridges:agm')
}

// Mojang ships Java 21 to end users in 1.21.1, so mods must target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// ModDevGradle registers only the NeoForged and Mojang repositories. JUnit
// lives on Central.
repositories {
    mavenCentral()
    mavenLocal()
}

// Three layers, one direction of dependency:
//
//   domain   <--  main (adapters)  <--  gametest (a real server)
//     ^
//     +----  test (plain JUnit; no Minecraft on its classpath at all)
//
// `domain` is the pure layer: the decisions this mod makes, over plain numbers
// and booleans. It is compiled against nothing but the JDK, so a
// `net.minecraft` import there is a compile error rather than something a
// reviewer has to catch. `gametest` is the only source set besides `main`
// that receives the modding dependencies; `test` never does, which is what
// keeps it fast and honest -- a test can only exercise what is pure.
sourceSets {
    domain
    gametest
}

// In a dev run SharedConstants.IS_RUNNING_IN_IDE is true, so the structure
// template manager reads gametest templates from <cwd>/gameteststructures/
// rather than from a resource pack. The templates are kept under devtools/
// beside the mcfunction harness and copied into place before the run.
var copyGameTestStructures = tasks.register("copyGameTestStructures", Copy) {
    from "devtools/gameteststructures"
    into "run/gameteststructures"
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        // The userdev `gameTestServer` run type: boots a headless server with
        // NeoForge's gametest framework enabled, runs every @GameTest in the
        // enabled namespaces, and exits with the number of failed required
        // tests -- so a red test fails the Gradle task. ModDevGradle has no
        // helper for this type the way it has client()/server(); `type` maps
        // straight onto the run-type key in NeoForge's userdev config.json.
        gameTestServer {
            type = "gameTestServer"
            sourceSet = sourceSets.gametest
            // NeoForge 21.1 reads the `neoforge.` prefix. The Forge-era
            // `forge.enabledGameTestNamespaces` is silently ignored.
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            taskBefore copyGameTestStructures
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.domain)
            sourceSet(sourceSets.main)
        }
        // The gametests are a mod of their own, with their own datapack,
        // because a mod's several resource roots cannot each supply a file at
        // one path -- the first root wins -- and the tests need their own
        // data-map entries beside the ones this jar ships. That also makes
        // them exercise the mod from outside, exactly as a pack author would.
        "${mod_id}_gametest" {
            sourceSet(sourceSets.gametest)
        }
        if (bridgeAgm != null) {
            "armedpillagers_agm" {
                sourceSet(bridgeAgm.sourceSets.main)
            }
        }
    }

    // Deliberately not `domain` and not `test` -- see the layering comment.
    addModdingDependenciesTo(sourceSets.gametest)
}

// The gametest mod is for the gametest run only; the client and server runs
// (and so the mcfunction harness) host the shipped mods alone.
neoForge.runs.matching { it.name != 'gameTestServer' }.configureEach {
    loadedMods = neoForge.mods.matching { it.name != "${mod_id}_gametest" }
}

// The gametest run's classpath is gametest.runtimeClasspath. Giving it main's
// *classes* (below) is not the same as giving it main's *dependencies*: without
// this, the nested protocol mod is absent from that run, the loader refuses
// to start for a missing mandatory dependency, zero tests execute, and the
// gametest server exits 0 for zero failures -- a green gate that tested
// nothing. Inheriting main's configurations is the fix; the README also tells
// the reader to look for the "required tests passed" line, not the exit code.
configurations {
    gametestImplementation.extendsFrom implementation
    gametestRuntimeOnly.extendsFrom runtimeOnly
}

dependencies {
    // No gun mod here. This mod codes against the protocol only; the bridge
    // subproject is where Another Gun Mod's classes are named.

    // The ranged-weapon protocol: compiled against, and nested Jar-in-Jar so
    // the pack needs no separate jar. The range is what this mod is compatible
    // with; the loader deduplicates nested copies and may hand a consumer a
    // lower version than it prefers if another mod caps the range.
    jarJar(implementation("com.nfx.rangedweapons:rangedweapons")) {
        version {
            strictly "[1.0,2.0)"
            prefer "1.0.0"
        }
    }

    implementation sourceSets.domain.output

    gametestImplementation sourceSets.main.output
    gametestImplementation sourceSets.domain.output
    // The bridge's classes on the run's classpath, as class directories
    // matching the mod coordinates above -- not its jar, which would be a
    // second copy of the same mod.
    if (bridgeAgm != null) {
        gametestRuntimeOnly bridgeAgm.sourceSets.main.output
    }

    // Plain JUnit 5 against the pure layer only. Gradle 9 no longer injects
    // the platform launcher, so it is declared. These exact versions are the
    // ones already in the local Gradle cache.
    testImplementation sourceSets.domain.output
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.9.2'
    testRuntimeOnly    'org.junit.jupiter:junit-jupiter-engine:5.9.2'
    testRuntimeOnly    'org.junit.platform:junit-platform-launcher:1.9.2'
}

tasks.named('test', Test) {
    // Gradle enables -ea for Test tasks by default; the domain layer's
    // checkRep() methods are `assert`s and rely on it.
    useJUnitPlatform()
}

// The shipped jar is main + domain. gametest is never shipped.
jar {
    from sourceSets.domain.output
}

// NeoForge dev runs scan run/mods, so when the bridge is built the gun mod has
// to physically be there or the bridge's hard dependency fails and the run
// dies before it starts. Without the jar this copies nothing and the runs
// host the main mod and the gametest mod on the protocol's fallback tier.
var copyGunModForRuns = tasks.register("copyGunModForRuns", Copy) {
    from "bridges/agm/libs/${gunmod_jar}"
    into "run/mods"
}
tasks.matching { it.name.startsWith("run") }.configureEach {
    dependsOn copyGunModForRuns
}

// The gametest server's exit code is the number of failed *required* tests,
// which is also zero when no test ran at all -- a mod the loader refused, a
// namespace typo, an empty holder class. So the exit code is not the
// assertion. The assertion is the framework's own summary line in the log,
// and the task fails without it. `check` runs the gate unless asked not to
// (`-PskipGameTests`) for fast iteration on the pure tests.
tasks.named('runGameTestServer') { task ->
    // Resolved now, not in the action: the configuration cache forbids the
    // action from touching the project.
    def logFile = layout.projectDirectory.file('run/logs/latest.log').asFile
    task.doLast {
        def text = logFile.exists() ? logFile.text : ''
        if (text =~ /Missing or unsupported mandatory|Mod loading has failed/) {
            throw new GradleException("gametest: the loader refused a mod; see ${logFile}")
        }
        def passed = (text =~ /All (\d+) required tests passed/)
        if (!passed.find()) {
            throw new GradleException("gametest: no 'required tests passed' line in ${logFile}")
        }
        task.logger.lifecycle("gametest: all ${passed.group(1)} required tests passed")
    }
}
if (!project.hasProperty('skipGameTests')) {
    tasks.named('check') {
        dependsOn 'runGameTestServer'
    }
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
