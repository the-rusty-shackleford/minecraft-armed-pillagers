modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="nfx"
description='''
Pillagers that carry firearms and know how to use them.

A slice of newly spawned pillagers carry a gun in place of the usual crossbow.
Which guns, and how often relative to each other, is a data map any datapack
can edit; how often at all is config. Vanilla pillager AI can only work a
crossbow, so armed pillagers get their own ranged goal: they close to their
weapon's range, hold line of sight, fire on the gun's own fire rate, and are
exposed while they reload. Automatic weapons and flamethrowers are never
handed out unless config says otherwise.

Works with any gun mod that speaks the Ranged Weapons protocol - natively
through a bridge, or from a datapack profile alone. Ships profiles and
loadouts for Another Gun Mod, used when that mod is present.

Killing one can yield the gun, loose ammunition, and a partly loaded magazine.
Every rate and chance lives in config/armedpillagers-common.toml.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# No gun mod is required. The profiles and loadouts this jar ships for Another
# Gun Mod are guarded by neoforge:mod_loaded conditions, and the native bridge
# for it is a separate jar (armedpillagers-agm) with its own dependency on it.
# AFTER so that, when present, its items exist before our data maps are read.
[[dependencies.${mod_id}]]
    modId="anothergunmod"
    type="optional"
    versionRange="[1.5,)"
    ordering="AFTER"
    side="BOTH"

# The ranged-weapon protocol this mod codes against. Nested in this jar, so
# it is always present; AFTER so its registrations exist before ours run.
[[dependencies.${mod_id}]]
    modId="rangedweapons"
    type="required"
    versionRange="[1.0,2.0)"
    ordering="AFTER"
    side="BOTH"
